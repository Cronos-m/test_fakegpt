<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #212121; color: #ececec; height: 100vh; overflow: hidden; }
  .app { display: flex; height: 100vh; }
  .sidebar { width: 260px; background: #171717; display: flex; flex-direction: column; padding: 8px; transition: margin-left 0.3s; }
  .sidebar.hidden { margin-left: -260px; }
  .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 8px; margin-bottom: 8px; }
  .icon-btn { background: none; border: none; color: #ececec; cursor: pointer; padding: 8px; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .icon-btn:hover { background: #2a2a2a; }
  .new-chat-btn { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: none; border: none; color: #ececec; cursor: pointer; border-radius: 8px; font-size: 14px; width: 100%; text-align: left; transition: background 0.2s; }
  .new-chat-btn:hover { background: #2a2a2a; }
  .history { flex: 1; overflow-y: auto; margin-top: 12px; }
  .history-item { padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.2s; position: relative; }
  .history-item:hover { background: #2a2a2a; }
  .history-item.active { background: #2a2a2a; }
  .history-item .delete-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); opacity: 0; transition: opacity 0.2s; }
  .history-item:hover .delete-btn { opacity: 1; }
  .user-section { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
  .user-section:hover { background: #2a2a2a; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #10a37f, #0d8a6a); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
  .main { flex: 1; display: flex; flex-direction: column; position: relative; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; }
  .model-selector { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 500; transition: background 0.2s; }
  .model-selector:hover { background: #2a2a2a; }
  .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
  .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
  .welcome h1 { font-size: 28px; font-weight: 500; }
  .suggestions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 600px; width: 100%; padding: 0 20px; }
  .suggestion { padding: 14px; border: 1px solid #383838; border-radius: 12px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
  .suggestion:hover { background: #2a2a2a; }
  .suggestion-title { font-weight: 500; margin-bottom: 4px; }
  .suggestion-sub { color: #8e8e8e; font-size: 13px; }
  
  /* ✅ NUEVO DISEÑO DE MENSAJES */
  .messages { max-width: 768px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px; }
  .message { display: flex; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  
  /* Usuario: Derecha, Azul */
  .message.user { justify-content: flex-end; }
  .message.user .message-content { background: #2563eb; color: white; border-radius: 18px 18px 4px 18px; max-width: 70%; padding: 12px 16px; }
  
  /* IA: Izquierda, Gris */
  .message.assistant { justify-content: flex-start; }
  .message.assistant .message-content { background: #2a2a2a; color: #ececec; border-radius: 18px 18px 18px 4px; max-width: 70%; padding: 12px 16px; }
  
  .message-content { line-height: 1.6; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }
  
  .input-area { padding: 12px 20px 20px; max-width: 768px; margin: 0 auto; width: 100%; }
  .input-wrapper { background: #303030; border-radius: 24px; padding: 12px 16px; display: flex; align-items: flex-end; gap: 10px; }
  .input-wrapper textarea { flex: 1; background: none; border: none; color: #ececec; font-size: 15px; resize: none; outline: none; max-height: 200px; font-family: inherit; line-height: 1.5; }
  .send-btn { width: 32px; height: 32px; border-radius: 50%; background: #ececec; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s; }
  .send-btn:disabled { background: #555; cursor: not-allowed; opacity: 0.5; }
  .footer-note { text-align: center; font-size: 12px; color: #8e8e8e; margin-top: 8px; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #383838; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }
  @media (max-width: 768px) { .sidebar { position: absolute; z-index: 10; height: 100%; } .suggestions { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="icon-btn" onclick="toggleSidebar()" title="Cerrar menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></button>
      <button class="icon-btn" onclick="newChat()" title="Nuevo chat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
    </div>
    <button class="new-chat-btn" onclick="newChat()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg> Nuevo chat</button>
    <div class="history" id="history"></div>
    <div class="user-section"><div class="avatar">U</div><div style="font-size:14px;">Usuario</div></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn" onclick="toggleSidebar()" id="menuBtn" style="display:none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg></button>
      <div class="model-selector">AI Chat 4o <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
      <div></div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <h1>¿En qué puedo ayudarte?</h1>
        <div class="suggestions">
          <div class="suggestion" onclick="useSuggestion('Dame ideas para un proyecto de programación')"><div class="suggestion-title">Ideas creativas</div><div class="suggestion-sub">para un proyecto de programación</div></div>
          <div class="suggestion" onclick="useSuggestion('Explícame cómo funciona la inteligencia artificial')"><div class="suggestion-title">Explícame un concepto</div><div class="suggestion-sub">cómo funciona la IA</div></div>
          <div class="suggestion" onclick="useSuggestion('Dime 100 bebidas más famosas')"><div class="suggestion-title">Lista de 100</div><div class="suggestion-sub">bebidas más famosas</div></div>
          <div class="suggestion" onclick="useSuggestion('Dame consejos para mejorar mi productividad')"><div class="suggestion-title">Consejos prácticos</div><div class="suggestion-sub">para mejorar mi productividad</div></div>
        </div>
      </div>
      <div class="messages" id="messages" style="display:none;"></div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <button class="icon-btn" title="Adjuntar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg></button>
        <textarea id="userInput" placeholder="Envía un mensaje a AI Chat" rows="1" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#212121" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      </div>
      <div class="footer-note">AI Chat puede cometer errores. Verifica la información importante.</div>
    </div>
  </main>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyARaGWz8WAn0h3sNEYrfLMvrWWttaiHCVY",
    authDomain: "adminfakegpt.firebaseapp.com",
    databaseURL: "https://adminfakegpt-default-rtdb.firebaseio.com",
    projectId: "adminfakegpt",
    storageBucket: "adminfakegpt.firebasestorage.app",
    messagingSenderId: "270301943650",
    appId: "1:270301943650:web:d9d61c31c963ed2ba57e3b"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const messagesEl = document.getElementById('messages');
  const welcomeEl = document.getElementById('welcome');
  const chatArea = document.getElementById('chatArea');
  const sidebar = document.getElementById('sidebar');
  const menuBtn = document.getElementById('menuBtn');
  const historyEl = document.getElementById('history');

  let conversations = [];
  let currentConversationId = null;

  input.addEventListener('input', () => { sendBtn.disabled = input.value.trim() === ''; });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
  function autoResize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
  function toggleSidebar() { sidebar.classList.toggle('hidden'); menuBtn.style.display = sidebar.classList.contains('hidden') ? 'flex' : 'none'; }
  function newChat() { currentConversationId = null; messagesEl.innerHTML = ''; messagesEl.style.display = 'none'; welcomeEl.style.display = 'flex'; updateHistoryUI(); }
  function useSuggestion(text) { input.value = text; sendBtn.disabled = false; sendMessage(); }

  function addMessage(role, text) {
    const msg = document.createElement('div');
    msg.className = 'message ' + role;
    // ✅ Sin avatares, solo el contenido
    msg.innerHTML = `<div class="message-content"></div>`;
    msg.querySelector('.message-content').textContent = text;
    messagesEl.appendChild(msg);
    chatArea.scrollTop = chatArea.scrollHeight;
    return msg.querySelector('.message-content');
  }

  function detect100Pattern(text) {
    const lowerText = text.toLowerCase();
    if (!/\b100\b/.test(lowerText)) return null;
    const match = text.match(/100\s+([a-záéíóúñ\s]+?)(?:\s+(?:más|mejores|top|del|de la|de los|de las)|\s*$)/i);
    if (match) return match[1].trim();
    const fallbackMatch = text.match(/100\s+(.+)/i);
    if (fallbackMatch) return fallbackMatch[1].trim().substring(0, 50);
    return null;
  }

  async function findTemplate(topic) {
    const snapshot = await db.ref('templates').once('value');
    const templatesData = snapshot.val() || {};
    const templates = Object.values(templatesData);
    const topicLower = topic.toLowerCase();
    return templates.find(t => {
      const keywordLower = t.keyword.toLowerCase();
      return topicLower.includes(keywordLower) || keywordLower.includes(topicLower);
    });
  }

  // ✅ CORRECCIÓN CLAVE: Usar ruta relativa '/api/chat' para Vercel
  async function query(prompt) {
    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error || 'Error en el servidor');
      }

      const data = await response.json();
      return data.text;
    } catch (error) {
      console.error("Error en la consulta segura:", error);
      throw error;
    }
  }

  async function generate100Response(topic, template) {
    const baseTemplate = template.baseTemplate || '¡Claro! Aquí tienes una lista de [solicitud]';
    const intro = baseTemplate.replace('[solicitud]', topic);
    const prompt = `Genera exactamente 100 elementos de "${topic}". Devuelve solo una lista numerada del 1 al 100, sin texto adicional, sin introducción, sin conclusión. Solo la lista.`;
    
    try {
      const aiList = await query(prompt);
      return `${intro}\n\n${aiList}`;
    } catch (error) {
      console.warn("La IA falló, activando modo de respaldo local:", error);
      let fallbackList = "";
      for (let i = 1; i <= 100; i++) {
        fallbackList += `${i}. Elemento de ${topic} número ${i}\n`;
      }
      return `${intro}\n\n⚠️ *(El servicio de IA tuvo un error, mostrando lista de respaldo)*\n\n${fallbackList}`;
    }
  }

  async function queryAI(message) {
    try {
      return await query(message);
    } catch (error) {
      return 'Lo siento, hubo un error de conexión con el servicio de IA. Por favor, intenta de nuevo.';
    }
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    if (!currentConversationId) {
      const newConv = { id: Date.now(), title: text.substring(0, 30) + (text.length > 30 ? '...' : ''), messages: [] };
      conversations.unshift(newConv);
      currentConversationId = newConv.id;
      updateHistoryUI();
    }

    welcomeEl.style.display = 'none';
    messagesEl.style.display = 'block';
    addMessage('user', text);
    
    const currentConv = conversations.find(c => c.id === currentConversationId);
    if (currentConv) currentConv.messages.push({ role: 'user', text });

    input.value = ''; input.style.height = 'auto'; sendBtn.disabled = true;
    const thinkingEl = addMessage('assistant', 'Pensando...');

    let response;
    const topic = detect100Pattern(text);
    
    if (topic) {
      const template = await findTemplate(topic);
      if (template) {
        response = await generate100Response(topic, template);
      } else {
        response = await queryAI(`Genera una lista de 100 ${topic}. Formato: "¡Claro! Aquí tienes una lista de ${topic}" seguido de la lista numerada del 1 al 100.`);
      }
    } else {
      response = await queryAI(text);
    }

    thinkingEl.textContent = response;
    if (currentConv) currentConv.messages.push({ role: 'assistant', text: response });
  }

  function updateHistoryUI() {
    historyEl.innerHTML = '';
    conversations.forEach(conv => {
      const item = document.createElement('div');
      item.className = 'history-item' + (conv.id === currentConversationId ? ' active' : '');
      item.innerHTML = `<span>${conv.title}</span><button class="icon-btn delete-btn" onclick="deleteConversation(event, ${conv.id})" title="Eliminar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>`;
      item.onclick = (e) => { if (!e.target.closest('.delete-btn')) loadConversation(conv.id); };
      historyEl.appendChild(item);
    });
  }

  function loadConversation(id) {
    currentConversationId = id;
    const conv = conversations.find(c => c.id === id);
    if (!conv) return;
    messagesEl.innerHTML = '';
    welcomeEl.style.display = 'none';
    messagesEl.style.display = 'block';
    conv.messages.forEach(msg => addMessage(msg.role, msg.text));
    updateHistoryUI();
  }

  function deleteConversation(event, id) {
    event.stopPropagation();
    conversations = conversations.filter(c => c.id !== id);
    if (currentConversationId === id) newChat();
    updateHistoryUI();
  }
</script>
</body>
</html>
